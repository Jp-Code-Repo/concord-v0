name: concord

# Shared by every Laravel service (IAM now; gate / HR / ticketing later).
x-laravel-env: &laravel-env
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  COOKIE_SECURE: ${COOKIE_SECURE:-false}

services:
  # The only thing published to the network. Serves the portal and routes /api/<service>/.
  edge:
    image: nginx:1.27-alpine
    container_name: edge
    ports:
      - "80:80"
    volumes:
      - ./infra/edge/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/edge/snippets:/etc/nginx/snippets:ro
      - ./services/concord-frontend/dist:/usr/share/nginx/html:ro
    networks: [concord-net]
    restart: unless-stopped

  # Shared base image (PHP + extensions + php.ini). Not run; only built:
  #   docker compose build php-base
  php-base:
    profiles: ["build"]
    build:
      context: ./infra/php
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: concord/php:8.3

  iam:
    build:
      context: ./services/iam
    image: concord/iam:dev
    container_name: iam
    working_dir: /var/www
    volumes:
      - ./services/iam:/var/www
      # asqueue pattern: keep the image's vendor/ instead of reading it through the
      # (slow) Windows bind mount. After changing composer.json/lock, rebuild with:
      #   docker compose up -d --build -V iam
      - /var/www/vendor
    environment:
      <<: *laravel-env
      APP_NAME: Concord IAM
      APP_KEY: ${IAM_APP_KEY}

      # IAM's primary database
      DB_DATABASE: concord_iam
      DB_USERNAME: iam
      DB_PASSWORD: ${IAM_DB_PASSWORD}

      # Concord platform database
      CONCORD_DB_DATABASE: concord
      CONCORD_DB_USERNAME: concord
      CONCORD_DB_PASSWORD: ${CONCORD_DB_PASSWORD}

      CACHE_PREFIX: iam

      # Designated Platform Administrator
      IAM_ADMIN_USERNAME: ${IAM_ADMIN_USERNAME}
      IAM_ADMIN_EMAIL: ${IAM_ADMIN_EMAIL}
      IAM_ADMIN_PASSWORD: ${IAM_ADMIN_PASSWORD}
      IAM_DEMO_SEED: ${IAM_DEMO_SEED:-false}
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [concord-net]
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: mysql
    # --skip-name-resolve: skip a reverse-DNS lookup on every new connection (PHP opens one per request).
    # Safe here: all grants are 'user'@'%'.
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD}
      HR_DB_PASSWORD: ${HR_DB_PASSWORD}
      CONCORD_DB_PASSWORD: ${CONCORD_DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/mysql/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports:
      - "127.0.0.1:3307:3306"   # local dev access only; remove for production
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [concord-net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [concord-net]
    restart: unless-stopped

networks:
  concord-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
