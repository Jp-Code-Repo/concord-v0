user  nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format request_timing '$time_iso8601 "$request" status=$status request_time=$request_time upstream_time=$upstream_response_time upstream_connect=$upstream_connect_time';
    access_log /dev/stdout request_timing;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's internal DNS. Upstreams are resolved per request (via variables),
    # so the edge still boots when a service container is down.
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 80 default_server;
        server_name _;
        client_max_body_size 20m;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---- Portal (React app goes here later) ----
        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }

        # ---- IAM: public endpoints (the app validates the cookie itself) ----
        location = /api/iam/verify {
            return 404;                      # internal only: reached via /_auth below
        }

        location = /api/iam/login {
            limit_req zone=login burst=10 nodelay;
            set $laravel_upstream iam:9000;
            include snippets/fastcgi-laravel.conf;
        }

        location /api/iam/ {
            set $laravel_upstream iam:9000;
            include snippets/fastcgi-laravel.conf;
        }

        # ---- Edge authentication ----
        # Every non-IAM service sits behind auth_request: the edge asks IAM
        # "who is this cookie?", and forwards the answer to the service as
        # CONCORD_USER_ID. That name has no HTTP_ prefix, so a client can never
        # forge it by sending a header.
        # NOTE: nginx subrequests share variables with the request that triggered
        # them. /_auth therefore sets only its own variable ($auth_upstream) and uses
        # literal params; it must never `set` anything the parent location uses.
        location = /_auth {
            internal;
            set $auth_upstream iam:9000;
            include snippets/fastcgi-base.conf;
            fastcgi_pass $auth_upstream;
            fastcgi_pass_request_body off;
            fastcgi_param REQUEST_URI    /api/iam/verify;
            fastcgi_param REQUEST_METHOD GET;
            fastcgi_param CONTENT_LENGTH "";
        }

        # Self-test of the pattern HR / tickets / etc. will use.
        location = /api/iam/edge-check {
            auth_request /_auth;
            auth_request_set $auth_user_id $upstream_http_x_user_id;
            set $laravel_upstream iam:9000;
            include snippets/fastcgi-laravel.conf;
            fastcgi_param CONCORD_USER_ID $auth_user_id;
        }

        # Template for a protected service (uncomment when the HR service exists):
        #
        # location /api/hr/ {
        #     auth_request /_auth;
        #     auth_request_set $auth_user_id $upstream_http_x_user_id;
        #     set $laravel_upstream hr:9000;
        #     include snippets/fastcgi-laravel.conf;
        #     fastcgi_param CONCORD_USER_ID $auth_user_id;
        # }
        #
        # WebSockets (notification service) later:
        # location /ws/ { set $reverb notif:8080; proxy_pass http://$reverb;
        #   proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade;
        #   proxy_set_header Connection $connection_upgrade; proxy_read_timeout 3600s; }
    }
}
