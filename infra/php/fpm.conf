; Sized for ~200 concurrent users (most are idle at any instant).
; Revisit with real numbers: each worker is ~30-60 MB.
[www]
user = www-data
group = www-data
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500

request_slowlog_timeout = 1s
slowlog = /tmp/iam-slow.log
request_slowlog_trace_depth = 30
