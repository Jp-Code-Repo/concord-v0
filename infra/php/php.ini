expose_php = Off
memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 20M
date.timezone = UTC

; ---- OPcache: same sizing as asqueue (asq-*-service/php.ini) ----
[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.save_comments = 1
; Source is bind-mounted for development, so file changes must be noticed.
; vendor/ is no longer on the mount, so the periodic stat checks are cheap now.
; For a production image set validate_timestamps = 0 (and restart php-fpm on deploy).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
; asqueue enables the tracing JIT (jit=1255, jit_buffer_size=128M). Measured on Concord IAM
; (nginx -> php-fpm -> MySQL/Redis, Linux filesystem) it made requests ~2 ms SLOWER
; (/me 14.6 ms vs 12.6 ms, logout 12.5 ms vs 10.6 ms), because these requests are short and
; I/O bound. It is off by default; uncomment both lines to match asqueue exactly.
opcache.jit = off
opcache.jit_buffer_size = 0
;opcache.jit = 1255
;opcache.jit_buffer_size = 128M

; ---- Path cache: fewer filesystem lookups per request ----
realpath_cache_size = 4096K
realpath_cache_ttl = 600
